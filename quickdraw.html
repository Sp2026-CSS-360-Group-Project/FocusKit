<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickDraw</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="quickdraw.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <span class="logo-icon">👁</span>
        <span class="logo-text">QuickDraw</span>
      </header>

      <!-- Step 1: Text input -->
      <div id="inputScreen" class="screen">
        <p class="label">Paste your text below</p>
        <textarea
          id="textInput"
          class="text-input"
          placeholder="Paste or type any text here..."
        ></textarea>
        <button id="goBtn" class="btn-primary">Go →</button>
      </div>

      <!-- Step 2: Word reader -->
      <div id="readerScreen" class="screen hidden">
        <div class="word-box">
          <span id="currentWord" class="current-word">Ready</span>
        </div>
        <div class="reader-controls">
          <button id="pauseBtn" class="btn-secondary">Pause</button>
          <button id="restartBtn" class="btn-secondary">Restart</button>
          <button id="backBtn" class="btn-outline">← New Text</button>
        </div>
      </div>

      <!-- Step 3: Done -->
      <div id="doneScreen" class="screen hidden">
        <p class="done-text">Done!</p>
        <button id="newTextBtn" class="btn-outline">New Text</button>
      </div>
    </div>

    <script src="quickdraw.js"></script>
  </body>
</html>
